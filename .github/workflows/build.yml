name: Build Wii U Park

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Download Crema framework
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/vs-sr-dev/wiiu-crema.git third_party/wiiu-crema

      - name: Install asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --break-system-packages pillow

      - name: Build Kenney game assets
        run: |
          python3 tools/build_assets.py \
            --roads kenney_city-kit-roads.zip \
            --suburban kenney_city-kit-suburban_20.zip \
            --nature kenney_nature-kit.zip \
            --crema third_party/wiiu-crema \
            --output build/park_content

      - name: Build Wii U game
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            devkitpro/devkitppc:latest \
            bash -lc 'cd /src && cmake -B build -DCMAKE_TOOLCHAIN_FILE=/src/third_party/wiiu-crema/cmake/wiiu-devkitpro.cmake -DCMAKE_BUILD_TYPE=Release -G "Unix Makefiles" && make -C build -j2'

      - name: Save game files
        uses: actions/upload-artifact@v4
        with:
          name: WiiU-Park-Build
          path: |
            build/**/*.wuhb
            build/**/*.rpx
